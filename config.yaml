
# Project Directories
directories:
  data: "data/"
  results: "results/"
  src: "src/"

# Dataset Configuration
datasets:
  merged_dataset:
    file: "data/merged_dateset.csv"
    description: "Dataset after merging and cleanup, retaining IDs"
  final_dataset:
    file: "data/final_dateset.csv"
    description: "Dataset after cleanup and ID removal"

# Output Model Files
outputs:
  catboost_model: "results/catboost_model.joblib"
  random_forest_model: "results/random_forest_model.joblib"
  logistic_regression_model: "results/logistic_regression_model.joblib"

# Evaluation Output Files
evaluation_outputs:
  evaluation_metrics:
    catboost: "results/CatBoost_evaluation_metrics.xlsx"
    random_forest: "results/random_forest_evaluation_metrics.xlsx"
    logistic_regression: "results/regression_evaluation_metrics.xlsx"
  class_prevalence:
    catboost: "results/CatBoost_class_prevalence.csv"
    random_forest: "results/random_forest_class_prevalence.csv"
    logistic_regression: "results/regression_class_prevalence.csv"
  calibration_plots:
    catboost: "results/calibration_plot_CatBoost.png"
    random_forest: "results/calibration_plot_random_forest.png"
    logistic_regression: "results/calibration_plot_regression.png"

# Data Splitting Configuration
data_split:
  test_size: 0.20
  random_state: 42
  stratify: true

# Logistic Regression Configuration
logistic_regression:
  max_iter: 1000
  random_state: 42

# Random Forest Configuration
random_forest:
  n_estimators: 50
  random_state: 42
  n_jobs: -1

# CatBoost Configuration
catboost:
  iterations: 100
  depth: 6
  learning_rate: 0.1
  loss_function: "Logloss"
  eval_metric: "AUC"
  random_seed: 42
  verbose: false
  thread_count: 4
  allow_writing_files: false

# Evaluation Metrics
evaluation:
  - "Macro AUROC"
  - "Macro AUPRC"
  - "Balanced Accuracy"
  - "Brier Score"
  - "Precision"
  - "Recall"
  - "F1 score"
  - "confusion_matrix"
  - "calibration_plot"